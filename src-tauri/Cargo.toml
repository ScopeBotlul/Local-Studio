[package]
name = "local-studio"
version = "0.4.1"
description = "Local Studio desktop core"
edition = "2021"
rust-version = "1.88"

[lib]
name = "local_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1", features = ["sync", "time", "macros"] }
sysinfo = "0.35"
sys-locale = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
oauth2 = { version = "5", default-features = false }
keyring = { version = "3", features = ["windows-native"] }
zeroize = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com"] }
url = "2"

[dev-dependencies]
tempfile = "3"

