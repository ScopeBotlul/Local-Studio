[package]
name = "local-studio"
version = "0.21.0"
description = "Local Studio desktop core"
edition = "2021"
rust-version = "1.88"

[lib]
name = "local_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ring = "=0.17.14"
sha1 = "0.10"
base64 = "=0.22.1"
png = "=0.17.16"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
sysinfo = "0.35"
sys-locale = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
oauth2 = { version = "5", default-features = false }
keyring = { version = "3", features = ["windows-native"] }
zeroize = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
url = "2"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
